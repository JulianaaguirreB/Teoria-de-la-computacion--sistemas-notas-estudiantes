<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Gestión de Notas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .content { padding: 30px; }
        .btn-nuevo { background: #4CAF50; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        .table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        .table th { background: #f4f4f4; }
        .action-buttons { display: flex; gap: 10px; }
        .btn-edit { background: #2196F3; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #f44336; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 10% auto; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; }
        .close { float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .resumen { margin-top: 30px; padding: 20px; background: #f4f4f4; border-radius: 5px; }
        .button { padding: 10px 20px; margin: 10px 5px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #estudianteInfo { margin-bottom: 20px; padding: 20px; background: #f4f4f4; border-radius: 5px; }
        .form-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-guardar { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-cancelar { background: #666; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gestión de Notas</h1>
            <p>Administra las calificaciones del estudiante</p>
        </div>
        <div class="content">
            <div id="estudianteInfo"></div>
            <button class="btn-nuevo" onclick="abrirFormularioNota()">+ Agregar Nota</button>
            <button class="button" onclick="calcularNotaFinal()">Calcular Nota Final</button>
            <h3>Lista de Notas</h3>
            <table class="table">
                <thead><tr><th>ID</th><th>Materia</th><th>Observación</th><th>Nota</th><th>Porcentaje</th><th>Contribución</th><th>Acciones</th></tr></thead>
                <tbody id="notasList"><tr><td colspan="7" style="text-align: center;">Cargando notas...</td></tr></tbody>
            </table>
            <div id="resumen" class="resumen"></div>
        </div>
    </div>
    </div>
    <!-- Modal para nota -->
    <div id="notaModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalNota()">&times;</span>
            <h2 id="modalTitulo">Agregar Nota</h2>
            <input type="hidden" id="notaId">
            <div class="form-group"><label>Materia:</label><input type="text" id="materia" required></div>
            <div class="form-group"><label>Observación:</label><textarea id="observacion" rows="3"></textarea></div>
            <div class="form-group"><label>Nota (0-5):</label><input type="number" id="valor" step="0.1" min="0" max="5" required></div>
            <div class="form-group"><label>Porcentaje (0-100):</label><input type="number" id="porcentaje" step="1" min="0" max="100" required></div>
            <div class="form-actions">
                <button class="btn-guardar" onclick="guardarNota()">Guardar</button>
                <button class="btn-cancelar" onclick="cerrarModalNota()">Cancelar</button>
            </div>
        </div>
    </div>
    
</style>
<!-- Modal para nota final -->
<div id="notaFinalModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="cerrarModalNotaFinal()">&times;</span>
        <h2>Nota Final</h2>
        <div id="notaFinalResultado"></div>  <!-- ← Este ID es importante -->
    </div>
</div>

    <!-- JavaScript separado -->
    <script src="js/nota.js"></script>
</body>
</html>
