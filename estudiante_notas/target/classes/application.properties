server.port=8081

# R2DBC H2 Configuration
spring.r2dbc.url=r2dbc:h2:mem:///estudiante_notas_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

# H2 Console (WebFlux compatible)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Datasource adicional para H2 Console
spring.datasource.url=jdbc:h2:mem:estudiante_notas_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Logging
logging.level.org.springframework.data.r2dbc=DEBUG
logging.level.io.r2dbc.h2=DEBUG
