<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Gestión de Estudiantes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .content { padding: 30px; }
        .btn-nuevo { background: #4CAF50; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; margin-right: 10px; font-size: 14px; }
        .btn-materias { background: #9C27B0; }
        .table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        .table th { background: #f4f4f4; font-weight: 600; }
        .action-buttons { display: flex; gap: 10px; }
        .btn-edit { background: #2196F3; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #f44336; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-notas { background: #FF9800; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-calcular { background: #9C27B0; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 10% auto; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; }
        .close { float: right; font-size: 28px; font-weight: bold; cursor: pointer; color: #aaa; }
        .close:hover { color: #000; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .form-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-guardar { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; flex: 1; }
        .btn-cancelar { background: #666; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sistema de Gestión de Estudiantes</h1>
            <p>Gestión de estudiantes y sus calificaciones</p>
        </div>
        <div class="content">
            <button class="btn-nuevo" onclick="abrirFormulario()">+ Nuevo Estudiante</button>
            <button class="btn-nuevo btn-materias" onclick="location.href='materia.html'">Gestionar Materias</button>
            
            <h3>Lista de Estudiantes</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="estudiantesList">
                    <tr><td colspan="5" style="text-align: center;">Cargando estudiantes...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="estudianteModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2 id="modalTitulo">Agregar Estudiante</h2>
            <form id="estudianteForm" onsubmit="event.preventDefault(); guardarEstudiante();">
                <input type="hidden" id="estudianteId">
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label>Apellido:</label>
                    <input type="text" id="apellido" required>
                </div>
                <div class="form-group">
                    <label>Correo:</label>
                    <input type="email" id="correo" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-guardar">Guardar</button>
                    <button type="button" class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/estudiante.js"></script>
</body>
</html>
