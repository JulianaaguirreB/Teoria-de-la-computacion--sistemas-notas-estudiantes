spring.datasource.url=jdbc:h2:mem:notasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8081
logging.level.edu.javeriana=DEBUG
# Configuración de logging para violaciones de seguridad
logging.level.SECURITY_VIOLATIONS=WARN
logging.file.name=logs/violaciones-seguridad.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} | %msg%n
logging.logback.rollingpolicy.file-name-pattern=logs/violaciones-seguridad-%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=30