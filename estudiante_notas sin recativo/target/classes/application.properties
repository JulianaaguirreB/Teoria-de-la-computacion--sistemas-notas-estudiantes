# Server configuration
server.port=8081

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:estudiante_notas_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (para ver la base de datos)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Para que los datos persistan mientras la app está corriendo
spring.datasource.url=jdbc:h2:mem:estudiante_notas_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE