<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Materias</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .content { padding: 30px; }
        .btn-nuevo { background: #4CAF50; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; margin: 10px 5px; }
        .table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        .table th { background: #f4f4f4; }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-edit { background: #2196F3; color: white; }
        .btn-delete { background: #f44336; color: white; }
        .btn-ver { background: #FF9800; color: white; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 10% auto; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; }
        .close { float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .form-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-guardar { background: #4CAF50; color: white; padding: 10px 20px; }
        .btn-cancelar { background: #666; color: white; padding: 10px 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gestión de Materias</h1>
        </div>
        <div class="content">
            <button class="btn-nuevo" onclick="abrirFormularioMateria()">+ Nueva Materia</button>
            <button class="btn-nuevo" onclick="location.href='index.html'" style="background: #666;">Volver</button>
            <table class="table">
                <thead><tr><th>ID</th><th>Nombre</th><th>Créditos</th><th>Acciones</th></tr></thead>
                <tbody id="materiasList"></tbody>
            </table>
        </div>
    </div>

    <div id="materiaModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalMateria()">&times;</span>
            <h2 id="modalTitulo">Nueva Materia</h2>
            <form id="materiaForm">
                <input type="hidden" id="materiaId">
                <div class="form-group"><label>Nombre:</label><input type="text" id="nombre" required></div>
                <div class="form-group"><label>Créditos:</label><input type="number" id="creditos" min="1" required></div>
                <div class="form-actions">
                    <button type="submit" class="btn-guardar">Guardar</button>
                    <button type="button" class="btn-cancelar" onclick="cerrarModalMateria()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/materia.js"></script>
</body>
</html>
